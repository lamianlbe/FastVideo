; supervisord config for the LTX-2.3 server on hosts WITHOUT systemd
; (RunPod pods, bare containers). This is the in-container replacement for
; ltx23@.service: RunPod's orchestrator runs the container exactly once and
; will NOT restart a crashed PID 1 (no systemd, no `docker run --restart`),
; so a supervisor INSIDE the container is the only way to get auto-restart.
;
; Launched by deploy/runpod_start.sh, which exports CONFIG/GPU/PORT/LOG_DIR
; and then `exec supervisord -n` (nodaemon -> stays PID 1, keeps the pod up).
;
; Control it like systemctl:
;   supervisorctl status
;   supervisorctl restart ltx23
;   supervisorctl tail -f ltx23           # live stdout ([request] JSON lines)
;   supervisorctl stop ltx23

[supervisord]
nodaemon=true
user=root
; supervisord's own log — on the persistent volume so it survives a restart.
logfile=%(ENV_LOG_DIR)s/supervisord.log
logfile_maxbytes=50MB
logfile_backups=3
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:ltx23]
; Mirrors ltx23@.service ExecStart. runpod_start.sh guarantees these env
; vars are set (with defaults), so the command line is fully resolved.
command=python server.py --config %(ENV_CONFIG)s --gpu %(ENV_GPU)s --port %(ENV_PORT)s --log-dir %(ENV_LOG_DIR)s
directory=/opt/FastVideo/examples/inference/ltx23_server
autostart=true
; on-failure semantics, exactly like systemd Restart=on-failure:
;   exit 0            -> clean shutdown, do NOT restart  (in `exitcodes`)
;   any other code    -> crash OR the server's own exit(1) on a wedged GPU
;                        (max_consecutive_failures) -> restart a fresh process
autorestart=unexpected
exitcodes=0
; process must stay up 30s to count as "started"; warmup (the long compile)
; happens after the port-less start, so don't gate on it — matches the
; systemd note "Warmup runs before the port binds; don't gate on it".
startsecs=30
; give up after 5 rapid failed starts (== StartLimitBurst=5): a wedged GPU
; or bad config shouldn't loop forever.
startretries=5
; drain in-flight requests on stop, exactly like the systemd unit
; (KillSignal=SIGINT + TimeoutStopSec=30).
stopsignal=INT
stopwaitsecs=30
; env -u LD_LIBRARY_PATH equivalent: keep pip/torch's bundled CUDA libs ahead
; of any system cuBLAS. FA4 + FLASH_ATTN is the validated serving stack.
environment=LD_LIBRARY_PATH="",FASTVIDEO_ATTENTION_BACKEND="FLASH_ATTN",FASTVIDEO_FA4="1"
; Server stdout (warmup progress + [request] JSON lines) -> persistent volume,
; rotated. The config's own log_dir still holds the structured request log.
stdout_logfile=%(ENV_LOG_DIR)s/server.log
stdout_logfile_maxbytes=100MB
stdout_logfile_backups=10
redirect_stderr=true
